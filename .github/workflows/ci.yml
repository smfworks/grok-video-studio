name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
      - name: Cache whisper model
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - name: Install (pinned Piper + voice, sha256-checked) and Python deps
        run: ./install.sh "$RUNNER_TEMP/vstudio"
      - name: Tests
        env: { VSTUDIO_PIPER_DIR: "${{ runner.temp }}/vstudio/piper", PYTHONDONTWRITEBYTECODE: "1" }
        run: python -m unittest discover -s tests -v
